name: Automated Daily Deployment & Sitemap Refresh

on:
  schedule:
    # Runs everyday at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Fresh Daily Sitemap & Build Production Artifacts
        run: npm run build

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0519197985 }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project gen-lang-client-0519197985 --non-interactive

